# 系统级配置（启动时加载，环境变量优先）
# 业务级配置（项目/人员/工单类型/优先级规则/审批流/通知策略/SLA）
# 存数据库 config 表，通过管理后台编辑，不写死在此文件

system:
  app_name: 工单管理平台
  timezone: Asia/Shanghai
  date_format: YYYY-MM-DD
  default_page_size: 20
  max_upload_mb: 50
  session_timeout_minutes: 720

# 默认数据（首次初始化种子数据用，后续以数据库为准）
seed:
  # 工单类型（统一口径）：来源/工单类型/异常指标大类三合一（2026-09-17）
  # flow: alert=五阶段闭环 / plan=运营计划流 / default=普通三步闭环
  # default_approver_name 每类都配；default_person_name 仅 8 类异常配（告警分派的系统兜底责任人）
  work_order_types:
    - { code: plan,         name: 运营计划工单,     color: "#2563eb", flow: plan,    default_approver_name: 金惠良, default_person_name: "" }
    - { code: power_gen,    name: 发电量异常工单,   color: "#dc2626", flow: alert,   default_approver_name: 金惠良, default_person_name: 金惠良 }
    - { code: curtailment,  name: 限电量异常工单,   color: "#d97706", flow: alert,   default_approver_name: 金惠良, default_person_name: 金惠良 }
    - { code: dual_rule,    name: 双细则异常工单,   color: "#7c3aed", flow: alert,   default_approver_name: 金惠良, default_person_name: 徐林杰 }
    - { code: reliability,  name: 设备可靠性异常工单, color: "#ea580c", flow: alert, default_approver_name: 金惠良, default_person_name: 金惠良 }
    - { code: info_quality, name: 信息化使用异常工单, color: "#2563eb", flow: alert, default_approver_name: 金惠良, default_person_name: 金惠良 }
    - { code: contract,     name: 应签未签工单,     color: "#0891b2", flow: alert,   default_approver_name: 金惠良, default_person_name: 金惠良 }
    - { code: cost,         name: 成本费用工单,     color: "#059669", flow: alert,   default_approver_name: 金惠良, default_person_name: 金惠良 }
    - { code: satisfaction, name: 客户满意度工单,   color: "#db2777", flow: alert,   default_approver_name: 金惠良, default_person_name: 金惠良 }
    - { code: meeting,      name: 关键会议工单,     color: "#d97706", flow: default, default_approver_name: 金惠良, default_person_name: "" }

  # 工单状态机（code -> 允许的下一状态 code 列表）
  statuses:
    pending:   { name: 待派发, color: gray,   next: [approving] }
    approving: { name: 审批中, color: blue,   next: [dispatched, rejected] }
    dispatched: { name: 已派发, color: amber,  next: [executing] }
    executing: { name: 执行中, color: blue,   next: [verifying, overdue] }
    verifying: { name: 待验收, color: amber,  next: [closed, executing] }
    closed:    { name: 已闭环, color: green,  next: [] }
    overdue:   { name: 已逾期, color: red,    next: [executing, verifying, closed] }
    rejected:  { name: 已驳回, color: gray,   next: [] }
    judging:   { name: 判断中, color: purple, next: [closed] }

  # SLA 定义（按优先级，截止天数）
  sla:
    P1: { deadline_days: 1, warn_before_hours: 4,  escalate_hours: 24 }
    P2: { deadline_days: 3, warn_before_hours: 24, escalate_hours: 72 }
    P3: { deadline_days: 7, warn_before_hours: 48, escalate_hours: 168 }
