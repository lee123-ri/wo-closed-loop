---
# Celery Worker（异步通知、OA 发起）
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wo-worker
  labels: { app: wo-worker }
spec:
  replicas: 2
  selector:
    matchLabels: { app: wo-worker }
  template:
    metadata:
      labels: { app: wo-worker }
    spec:
      containers:
        - name: worker
          image: registry.cn-hangzhou.aliyuncs.com/wo/wo-backend:latest
          command: ["/entrypoint.sh"]
          args: ["celery", "-A", "app.celery_app", "worker", "-l", "info", "--concurrency=4"]
          envFrom:
            - secretRef: { name: wo-secrets }
          env:
            - name: APP_ENV
              value: "production"
          resources:
            requests: { cpu: "200m", memory: "256Mi" }
            limits: { cpu: "1000m", memory: "1Gi" }
          volumeMounts:
            - name: dws-auth
              mountPath: /secrets
              readOnly: true
      volumes:
        - name: dws-auth
          secret:
            secretName: wo-dws-auth
            optional: true
          # 无需就绪探针，Celery 自带健康检查
---
# Celery Beat（定时任务：SLA 扫描、升级扫描）
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wo-scheduler
  labels: { app: wo-scheduler }
spec:
  replicas: 1   # beat 必须单实例，避免重复调度
  selector:
    matchLabels: { app: wo-scheduler }
  template:
    metadata:
      labels: { app: wo-scheduler }
    spec:
      containers:
        - name: scheduler
          image: registry.cn-hangzhou.aliyuncs.com/wo/wo-backend:latest
          command: ["/entrypoint.sh"]
          args: ["celery", "-A", "app.celery_app", "beat", "-l", "info"]
          envFrom:
            - secretRef: { name: wo-secrets }
          env:
            - name: APP_ENV
              value: "production"
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
          volumeMounts:
            - name: dws-auth
              mountPath: /secrets
              readOnly: true
      volumes:
        - name: dws-auth
          secret:
            secretName: wo-dws-auth
            optional: true
---
# 机密配置（wo-secrets）不在此清单定义，必须由 ACK/云效凭据库在部署前创建或更新。
# 这样 kubectl apply 本文件不会用示例值覆盖线上数据库、钉钉或 JWT 凭据。
# 所需变量与创建命令见 docs/DEPLOYMENT.md 及 backend/.env.production.example。
---
# Ingress（对接 ALB）
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wo-ingress
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS": 443}]'
    alb.ingress.kubernetes.io/certificate-id: wo-tls-cert
spec:
  rules:
    - host: wo.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service: { name: wo-backend, port: { number: 8000 } }
          - path: /
            pathType: Prefix
            backend:
              service: { name: wo-frontend, port: { number: 80 } }
