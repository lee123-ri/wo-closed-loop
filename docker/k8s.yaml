---
# Celery Worker（异步通知、OA 发起）
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wo-worker
  labels: { app: wo-worker }
spec:
  replicas: 2
  selector:
    matchLabels: { app: wo-worker }
  template:
    metadata:
      labels: { app: wo-worker }
    spec:
      containers:
        - name: worker
          image: registry.cn-hangzhou.aliyuncs.com/wo/wo-backend:latest
          command: ["/entrypoint.sh"]
          args: ["celery", "-A", "app.celery_app", "worker", "-l", "info", "--concurrency=4"]
          envFrom:
            - secretRef: { name: wo-secrets }
          env:
            - name: APP_ENV
              value: "production"
          resources:
            requests: { cpu: "200m", memory: "256Mi" }
            limits: { cpu: "1000m", memory: "1Gi" }
          volumeMounts:
            - name: dws-auth
              mountPath: /secrets
              readOnly: true
      volumes:
        - name: dws-auth
          secret:
            secretName: wo-dws-auth
            optional: true
          # 无需就绪探针，Celery 自带健康检查
---
# Celery Beat（定时任务：SLA 扫描、升级扫描）
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wo-scheduler
  labels: { app: wo-scheduler }
spec:
  replicas: 1   # beat 必须单实例，避免重复调度
  selector:
    matchLabels: { app: wo-scheduler }
  template:
    metadata:
      labels: { app: wo-scheduler }
    spec:
      containers:
        - name: scheduler
          image: registry.cn-hangzhou.aliyuncs.com/wo/wo-backend:latest
          command: ["/entrypoint.sh"]
          args: ["celery", "-A", "app.celery_app", "beat", "-l", "info"]
          envFrom:
            - secretRef: { name: wo-secrets }
          env:
            - name: APP_ENV
              value: "production"
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
          volumeMounts:
            - name: dws-auth
              mountPath: /secrets
              readOnly: true
      volumes:
        - name: dws-auth
          secret:
            secretName: wo-dws-auth
            optional: true
---
# 配置项：外部化（钉钉 key、DB 连接等敏感信息进 Secret）
apiVersion: v1
kind: Secret
metadata:
  name: wo-secrets
type: Opaque
stringData:
  # 真实部署时用 kubectl create secret 或 sealed-secrets 注入
  DATABASE_URL: "postgresql+psycopg://wo:CHANGE_ME@rds-host:5432/wo_closed_loop"
  REDIS_URL: "redis://tair-host:6379/0"
  JWT_SECRET: "CHANGE_ME_TO_RANDOM_64_CHARS"
  APP_ENV: "production"
  AUTO_SEED: "false"                  # 生产禁止自动灌演示数据
  DINGTALK_APP_KEY: ""
  DINGTALK_APP_SECRET: ""
  DINGTALK_AGENT_ID: ""
  DINGTALK_OA_TEMPLATE_ID: ""
  DINGTALK_CORP_ID: ""
  DINGTALK_CALLBACK_URL: "https://wo.example.com/api/auth/dingtalk/callback"  # 必须改为线上 HTTPS 域名
  DINGTALK_CALLBACK_TOKEN: ""
  DINGTALK_CALLBACK_AES_KEY: ""
  DASHSCOPE_API_KEY: ""
  OSS_ENDPOINT: ""
  OSS_BUCKET: ""
  OSS_ACCESS_KEY_ID: ""
  OSS_ACCESS_KEY_SECRET: ""
  CORS_ORIGINS: "https://wo.example.com"
  JUDGMENT_AGENT_URL: "http://wo-judgment-agent:8080"
  JUDGMENT_AGENT_TOKEN: ""
  JUDGMENT_TIMEOUT: "10"
  JUDGMENT_ENABLED: "false"           # v1 判断Agent不部署，走降级日志；镜像就绪后改 true
---
# Ingress（对接 ALB）
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wo-ingress
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS": 443}]'
    alb.ingress.kubernetes.io/certificate-id: wo-tls-cert
spec:
  rules:
    - host: wo.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service: { name: wo-backend, port: { number: 8000 } }
          - path: /
            pathType: Prefix
            backend:
              service: { name: wo-frontend, port: { number: 80 } }
