# K8s 部署清单（ACK 托管集群）

# 后端 Deployment + Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wo-backend
  labels: { app: wo-backend }
spec:
  replicas: 2
  selector:
    matchLabels: { app: wo-backend }
  template:
    metadata:
      labels: { app: wo-backend }
    spec:
      containers:
        - name: backend
          image: registry.cn-hangzhou.aliyuncs.com/wo/wo-backend:latest
          ports: [{ containerPort: 8000 }]
          envFrom:
            - secretRef: { name: wo-secrets }
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits: { cpu: "1000m", memory: "1Gi" }
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 10
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 5
          volumeMounts:
            - name: dws-auth
              mountPath: /secrets
              readOnly: true
      volumes:
        - name: dws-auth
          secret:
            secretName: wo-dws-auth   # kubectl create secret generic wo-dws-auth --from-file=dws-auth.tar.gz=<凭证包路径>
            optional: true            # 未创建时不阻塞启动，仅钉盘/AI表格同步不可用
---
apiVersion: v1
kind: Service
metadata:
  name: wo-backend
spec:
  selector: { app: wo-backend }
  ports: [{ port: 8000, targetPort: 8000 }]
---
# 前端 Deployment + Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wo-frontend
  labels: { app: wo-frontend }
spec:
  replicas: 2
  selector:
    matchLabels: { app: wo-frontend }
  template:
    metadata:
      labels: { app: wo-frontend }
    spec:
      containers:
        - name: frontend
          image: registry.cn-hangzhou.aliyuncs.com/wo/wo-frontend:latest
          ports: [{ containerPort: 80 }]
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: wo-frontend
spec:
  selector: { app: wo-frontend }
  ports: [{ port: 80, targetPort: 80 }]
---
